name: Build Android AAB



on:

  push:

    branches: [ "main", "master" ]

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up Python 3.11

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'



      - name: Set up Java JDK 17

        uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '17'



      - name: Configure buildozer.spec, Constraints, and Keystore

        run: |

          printf "Cython==0.29.36\nsetuptools<70.0.0\n" > "$GITHUB_WORKSPACE/pip-constraints.txt"

          printf "[app]\n" > buildozer.spec

          printf "title = Magic Kaleido-Pop Studio\n" >> buildozer.spec

          printf "package.name = kaleidopop\n" >> buildozer.spec

          printf "package.domain = org.abdullahstudios\n" >> buildozer.spec

          printf "source.dir = .\n" >> buildozer.spec

          printf "source.include_exts = py,png,jpg,kv,atlas,json\n" >> buildozer.spec

          printf "version = 1.0.0\n" >> buildozer.spec

          printf "requirements = python3==3.11.6,hostpython3==3.11.6,kivy==2.3.0,pyjnius==1.6.1\n" >> buildozer.spec

          printf "orientation = portrait\n" >> buildozer.spec

          printf "fullscreen = 1\n" >> buildozer.spec

          printf "android.presplash_color = #0D0D1A\n" >> buildozer.spec

          printf "android.api = 35\n" >> buildozer.spec

          printf "android.minapi = 24\n" >> buildozer.spec

          printf "android.ndk = 25b\n" >> buildozer.spec

          printf "android.accept_sdk_license = True\n" >> buildozer.spec

          printf "android.archs = arm64-v8a\n" >> buildozer.spec

          printf "android.release_artifact = aab\n" >> buildozer.spec

          printf "android.debug_artifact = apk\n" >> buildozer.spec

          printf "android.permissions =\n" >> buildozer.spec

          printf "android.allow_backup = True\n" >> buildozer.spec

          printf "p4a.branch = v2024.01.21\n\n" >> buildozer.spec

          printf "[buildozer]\n" >> buildozer.spec

          printf "log_level = 2\n" >> buildozer.spec

          printf "warn_on_root = 1\n" >> buildozer.spec

          rm -f "$GITHUB_WORKSPACE/upload-key.jks"

          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/upload-key.jks" -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass KaleidoPop2026 -keypass KaleidoPop2026 -dname "CN=Muhammad Abdullah, OU=GameDev, O=AbdullahStudios, L=Kamalia, S=Punjab, C=PK"



      - name: Install Linux System Dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake lld libltdl-dev build-essential ccache patch libstdc++6 aidl patchelf



      - name: Install Buildozer and Cython

        run: |

          python -m pip install --upgrade "pip<24.1" "setuptools<70.0.0" wheel

          python -m pip install buildozer==1.5.0 cython==0.29.36 virtualenv packaging appdirs



      - name: Build Debug APK for Phone

        env:

          PIP_CONSTRAINT: ${{ github.workspace }}/pip-constraints.txt

          ANDROID_HOME: ""

          ANDROID_SDK_ROOT: ""

          ANDROID_NDK: ""

          ANDROID_NDK_HOME: ""

          ANDROID_NDK_ROOT: ""

          ANDROID_NDK_LATEST_HOME: ""

          GRADLE_HOME: ""

        run: |

          python -m buildozer android debug



      - name: Upload Debug APK

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: debug-apk-for-phone

          path: bin/*.apk



      - name: Build and Sign Release AAB for Play Store

        env:

          PIP_CONSTRAINT: ${{ github.workspace }}/pip-constraints.txt

          ANDROID_HOME: ""

          ANDROID_SDK_ROOT: ""

          ANDROID_NDK: ""

          ANDROID_NDK_HOME: ""

          ANDROID_NDK_ROOT: ""

          ANDROID_NDK_LATEST_HOME: ""

          GRADLE_HOME: ""

          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/upload-key.jks

          P4A_RELEASE_KEYSTORE_PASSWD: KaleidoPop2026

          P4A_RELEASE_KEYALIAS_PASSWD: KaleidoPop2026

          P4A_RELEASE_KEYALIAS: upload

        run: |

          python -m buildozer android release

          mkdir -p bin

          cp "$GITHUB_WORKSPACE/upload-key.jks" bin/upload-key.jks



      - name: Upload Play Store AAB and Keystore

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: playstore-release-aab

          path: |

            bin/*.aab

            bin/upload-key.jks

            bin/*.apk

