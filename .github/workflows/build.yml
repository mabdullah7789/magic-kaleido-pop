name: Build Android AAB



on:

  push:

    branches: [ "main", "master" ]

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up Python 3.10

        uses: actions/setup-python@v5

        with:

          python-version: '3.10'



      - name: Set up Java JDK 17

        uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '17'



      - name: Configure buildozer.spec & Generate Keystore

        run: |

          if [ -f "buildozer_spec.txt" ] && [ ! -f "buildozer.spec" ]; then

            cp buildozer_spec.txt buildozer.spec

          fi

          cat << 'EOF' > buildozer.spec

          [app]

          title = Magic Kaleido-Pop Studio

          package.name = kaleidopop

          package.domain = org.abdullahstudios

          source.dir = .

          source.include_exts = py,png,jpg,kv,atlas,json

          version = 1.0.0

          requirements = python3,kivy==2.3.0

          orientation = portrait

          fullscreen = 1

          android.presplash_color = #0D0D1A

          android.api = 34

          android.minapi = 24

          android.ndk = 25b

          android.accept_sdk_license = True

          android.archs = arm64-v8a

          android.release_artifact = aab

          android.debug_artifact = apk

          android.permissions =

          android.allow_backup = True

          p4a.branch = develop



          [buildozer]

          log_level = 2

          warn_on_root = 1

          EOF



          rm -f "$GITHUB_WORKSPACE/upload-key.jks"

          keytool -genkeypair -v \

            -keystore "$GITHUB_WORKSPACE/upload-key.jks" \

            -keyalg RSA -keysize 2048 -validity 10000 \

            -alias upload \

            -storepass KaleidoPop2026 \

            -keypass KaleidoPop2026 \

            -dname "CN=Muhammad Abdullah, OU=GameDev, O=AbdullahStudios, L=Kamalia, S=Punjab, C=PK"



      - name: Install Linux System Dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y \

            git zip unzip autoconf libtool pkg-config \

            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \

            cmake libffi-dev libssl-dev automake \

            lld libltdl-dev build-essential ccache patch libstdc++6 aidl



      - name: Install Buildozer and Cython

        run: |

          pip install --upgrade "pip<24.1" "setuptools<70.0.0" wheel

          pip install git+https://github.com/kivy/buildozer.git@master cython==0.29.36 virtualenv packaging appdirs



      - name: Pre-Accept Android SDK Licenses & Install SDK 34 + Build-Tools

        run: |

          if [ -d "$ANDROID_HOME" ]; then

            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

          fi



      - name: Build Debug APK for Phone

        run: |

          yes | buildozer android debug



      - name: Upload Debug APK

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: debug-apk-for-phone

          path: bin/*.apk



      - name: Build and Sign Release AAB for Play Store

        env:

          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/upload-key.jks

          P4A_RELEASE_KEYSTORE_PASSWD: KaleidoPop2026

          P4A_RELEASE_KEYALIAS_PASSWD: KaleidoPop2026

          P4A_RELEASE_KEYALIAS: upload

        run: |

          yes | buildozer android release

          cp "$GITHUB_WORKSPACE/upload-key.jks" bin/upload-key.jks



      - name: Upload Play Store AAB and Keystore

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: playstore-release-aab

          path: |

            bin/*.aab

            bin/upload-key.jks

            bin/*.apk

